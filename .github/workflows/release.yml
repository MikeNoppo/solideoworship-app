name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  SDW_UPDATE_PUBLIC_KEY: ${{ vars.SDW_UPDATE_PUBLIC_KEY }}
  INNO_SETUP_URL: https://github.com/jrsoftware/issrc/releases/download/is-7_1_1/innosetup-7.1.1-x64.exe
  INNO_SETUP_SHA256: 8a5a6711c3766a6e5fb74f280ba0e3551e719ce94538d901fdbd1f8f9920b3f0

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Read the workspace version
        id: version
        run: |
          version=$(cargo +stable metadata --no-deps --format-version 1 | jq -r '[.packages[].version] | unique | if length == 1 then .[0] else error("crate versions differ") end')
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the workspace version $version"
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == tag && ! "$SDW_UPDATE_PUBLIC_KEY" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Configure the release Ed25519 public key in SDW_UPDATE_PUBLIC_KEY"
            exit 1
          fi
          prerelease=false
          if [[ "${version%%+*}" == *-* ]]; then
            prerelease=true
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  windows:
    name: Windows installer
    needs: version
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: ./.github/actions/setup-windows-ffmpeg
      - run: cargo build --release --locked -p sdw-app --bins
      - name: Check that the exe needs no MSVC runtime DLLs
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $dumpbin = & $vswhere -latest -products * -find 'VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe' | Select-Object -First 1
          if (-not $dumpbin) { throw 'dumpbin.exe not found' }
          $dependents = & $dumpbin /nologo /dependents target\release\sdw-app.exe
          if ($LASTEXITCODE -ne 0) { throw "dumpbin failed with exit code $LASTEXITCODE" }
          $dependents
          if ($dependents -match '(?i)^\s*(vcruntime|msvcp|ucrtbase|api-ms-win-crt)') { throw 'sdw-app.exe links the MSVC runtime dynamically' }
      - name: Install Inno Setup
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup.exe'
          Invoke-WebRequest -Uri $env:INNO_SETUP_URL -OutFile $installer
          $hash = (Get-FileHash -Algorithm SHA256 $installer).Hash
          if ($hash -ne $env:INNO_SETUP_SHA256) { throw "Inno Setup checksum mismatch: $hash" }
          $dir = Join-Path $env:RUNNER_TEMP 'inno-setup'
          $setup = Start-Process -FilePath $installer -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/DIR=`"$dir`"" -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Inno Setup install failed with exit code $($setup.ExitCode)" }
          "ISCC=$(Join-Path $dir 'ISCC.exe')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build the installer
        shell: pwsh
        run: '& $env:ISCC "/DAppVersion=$env:VERSION" packaging/windows/solideoworship.iss'
      - name: Test Windows update preflight
        shell: pwsh
        run: |
          $badVersion = "$env:VERSION-preflight-test"
          & $env:ISCC "/DAppVersion=$badVersion" "/O$env:RUNNER_TEMP" packaging/windows/solideoworship.iss
          if ($LASTEXITCODE -ne 0) { throw 'Could not build the failing preflight fixture' }
          $setup = (Resolve-Path "target/installer/SolideoWorship-$env:VERSION-windows-x64-setup.exe").Path
          $badSetup = Join-Path $env:RUNNER_TEMP "SolideoWorship-$badVersion-windows-x64-setup.exe"
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -ne $env:FFMPEG_BIN_DIR }) -join ';'

          function Invoke-UpdateInstaller($installer, $arguments) {
            $file = [System.IO.File]::Open($installer, 'Open', 'Read', 'Read')
            try {
              return (Start-Process -FilePath $installer -ArgumentList $arguments -Wait -PassThru).ExitCode
            } finally {
              $file.Dispose()
            }
          }

          foreach ($scope in @('CURRENTUSER', 'ALLUSERS')) {
            $dir = Join-Path $env:RUNNER_TEMP "SolideoWorship $scope"
            $arguments = '/{0} /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP- /SDWUpdate=1 /DIR="{1}"' -f $scope, $dir
            $result = Invoke-UpdateInstaller $setup "$arguments /LANG=en"
            if ($result -ne 0) { throw "Valid $scope preflight failed with $result" }
            $language = Join-Path $dir 'language'
            if ((Get-Content -Raw $language) -ne 'en') { throw "Expected English in $scope installation" }
            $result = Invoke-UpdateInstaller $badSetup "$arguments /LANG=id"
            if ($result -ne 7) { throw "Expected $scope preflight failure, got $result" }
            if ((Get-Content -Raw $language) -ne 'en') { throw "Failed $scope update modified the installation" }
            $app = Start-Process -FilePath (Join-Path $dir 'SolideoWorship.exe') -ArgumentList '--update-probe', $env:VERSION -Wait -PassThru
            if ($app.ExitCode -ne 0) { throw "Original $scope installation could not start" }
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows
          path: target/installer/*.exe
          if-no-files-found: error

  linux:
    name: Linux tarball
    needs: version
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Linux system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxcb1-dev libasound2-dev pkg-config libavcodec-dev libavfilter-dev libavformat-dev libavutil-dev libswscale-dev libswresample-dev
      - run: rustup toolchain install
      - run: packaging/linux/package.sh "$VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: linux
          path: target/dist/*.tar.gz
          if-no-files-found: error

  sign:
    name: Sign update checksums
    if: github.ref_type == 'tag'
    needs: [version, windows, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release-signing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          path: dist
          merge-multiple: true
      - name: Sign the platform checksums
        working-directory: dist
        env:
          VERSION: ${{ needs.version.outputs.version }}
          SDW_UPDATE_SIGNING_KEY: ${{ secrets.SDW_UPDATE_SIGNING_KEY }}
        run: |
          umask 077
          key=$(mktemp)
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$SDW_UPDATE_SIGNING_KEY" > "$key"
          unset SDW_UPDATE_SIGNING_KEY
          public_der=$(openssl pkey -in "$key" -pubout -outform DER | od -An -v -tx1 | tr -d ' \n')
          if [[ "$public_der" != "302a300506032b6570032100$SDW_UPDATE_PUBLIC_KEY" ]]; then
            echo "::error::The Ed25519 signing key does not match SDW_UPDATE_PUBLIC_KEY"
            exit 1
          fi
          sha256sum -- "SolideoWorship-$VERSION-windows-x64-setup.exe" "SolideoWorship-$VERSION-linux-x86_64.tar.gz" > SHA256SUMS.txt
          openssl pkeyutl -sign -rawin -inkey "$key" -in SHA256SUMS.txt -out SHA256SUMS.txt.sig
          openssl pkeyutl -verify -rawin -inkey "$key" -in SHA256SUMS.txt -sigfile SHA256SUMS.txt.sig
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: update-signature
          path: dist/SHA256SUMS.txt*
          if-no-files-found: error

  release:
    name: Draft release
    if: github.ref_type == 'tag'
    needs: [version, sign]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          path: dist
          merge-multiple: true
      - name: Check release artifacts
        working-directory: dist
        run: |
          test "$(wc -c < SHA256SUMS.txt.sig)" -eq 64
          sha256sum --strict --check SHA256SUMS.txt
      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null || true)
          case $draft in
            true)
              gh release upload "$TAG" dist/* --clobber
              gh release edit "$TAG" --prerelease="$PRERELEASE"
              ;;
            false)
              echo "::error::Release $TAG is already published; its files are left untouched"
              exit 1
              ;;
            *)
              gh release create "$TAG" --draft --prerelease="$PRERELEASE" --verify-tag --title "SolideoWorship ${TAG#v}" --generate-notes dist/*
              ;;
          esac
