name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  SDW_UPDATE_PUBLIC_KEY: ${{ vars.SDW_UPDATE_PUBLIC_KEY }}

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      native_matrix: ${{ steps.version.outputs.native_matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Read the workspace version
        id: version
        run: |
          version=$(cargo +stable metadata --no-deps --format-version 1 | jq -r '[.packages[].version] | unique | if length == 1 then .[0] else error("crate versions differ") end')
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the workspace version $version"
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == tag && ! "$SDW_UPDATE_PUBLIC_KEY" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Configure the release Ed25519 public key in SDW_UPDATE_PUBLIC_KEY"
            exit 1
          fi
          prerelease=false
          if [[ "${version%%+*}" == *-* ]]; then
            prerelease=true
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          matrix=$(jq -cn --argjson prerelease "$prerelease" '{include: ([
            {platform: "windows", arch: "x86_64", runner: "windows-2025"},
            {platform: "linux", arch: "x86_64", runner: "ubuntu-22.04"}
          ] + if $prerelease then [
            {platform: "macos", arch: "aarch64", runner: "macos-15"},
            {platform: "macos", arch: "x86_64", runner: "macos-15-intel"}
          ] else [] end)}')
          echo "native_matrix=$matrix" >> "$GITHUB_OUTPUT"

  native:
    name: Packages (${{ matrix.platform }}, ${{ matrix.arch }})
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.version.outputs.native_matrix) }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      MACOSX_DEPLOYMENT_TARGET: "15.0"
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"
      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxcb1-dev libasound2-dev pkg-config libavcodec-dev libavfilter-dev libavformat-dev libavutil-dev libswscale-dev libswresample-dev dpkg-dev file libfuse2
      - name: Install macOS FFmpeg
        if: runner.os == 'macOS'
        run: brew install ffmpeg pkg-config
      - uses: ./.github/actions/setup-windows-ffmpeg
        if: runner.os == 'Windows'
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      - run: cargo install cargo-packager --version 0.11.8 --locked
      - run: python -m unittest discover -s packaging -p "test_*.py"
      - name: Package release binaries
        run: python packaging/package.py
      - name: Check that the exe needs no MSVC runtime DLLs
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $dumpbin = & $vswhere -latest -products * -find 'VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe' | Select-Object -First 1
          if (-not $dumpbin) { throw 'dumpbin.exe not found' }
          foreach ($exe in @('sdw-app', 'sdw-updater')) {
            $dependents = & $dumpbin /nologo /dependents "target\release\$exe.exe"
            if ($LASTEXITCODE -ne 0) { throw "dumpbin failed with exit code $LASTEXITCODE" }
            if ($dependents -match '(?i)^\s*(vcruntime|msvcp|ucrtbase|api-ms-win-crt)') { throw "$exe links the MSVC runtime dynamically" }
          }
      - name: Test native installations and signed upgrades
        shell: bash
        env:
          PACKAGE_PLATFORM: ${{ matrix.platform }}
          PACKAGE_ARCH: ${{ matrix.arch }}
        run: python packaging/smoke.py "target/dist/$PACKAGE_PLATFORM-$PACKAGE_ARCH" "$VERSION" --upgrades
      - name: Test Debian package installation with APT
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y ./target/dist/linux-x86_64/*.deb
          solideoworship --update-probe "$VERSION"
          sudo apt-get remove -y solideoworship
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ matrix.platform }}-${{ matrix.arch }}
          path: target/dist/${{ matrix.platform }}-${{ matrix.arch }}/*
          if-no-files-found: error

  arch:
    name: Arch Linux package
    needs: version
    runs-on: ubuntu-latest
    container: archlinux:base
    timeout-minutes: 90
    steps:
      - name: Install Arch build dependencies
        run: pacman -Syu --noconfirm --needed base-devel rustup clang alsa-lib ffmpeg libxcb python git openssl
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build the native Pacman package
        run: |
          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          runuser -u builder -- rustup toolchain install
          runuser -u builder -- cargo install cargo-packager --version 0.11.8 --locked
          runuser -u builder -- env PATH="/home/builder/.cargo/bin:$PATH" python packaging/package.py --format pacman
      - name: Test Pacman installation
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          pacman -U --noconfirm target/dist/linux-x86_64/*.pkg.tar.zst
          solideoworship --update-probe "$VERSION"
          pacman -R --noconfirm solideoworship
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: arch-x86_64
          path: target/dist/linux-x86_64/*.pkg.tar.zst
          if-no-files-found: error

  sign:
    name: Sign update checksums
    if: github.ref_type == 'tag'
    needs: [version, native, arch]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release-signing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          path: dist
          merge-multiple: true
      - name: Sign the platform checksums
        working-directory: dist
        env:
          VERSION: ${{ needs.version.outputs.version }}
          SDW_UPDATE_SIGNING_KEY: ${{ secrets.SDW_UPDATE_SIGNING_KEY }}
        run: |
          umask 077
          key=$(mktemp)
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$SDW_UPDATE_SIGNING_KEY" > "$key"
          unset SDW_UPDATE_SIGNING_KEY
          public_der=$(openssl pkey -in "$key" -pubout -outform DER | od -An -v -tx1 | tr -d ' \n')
          if [[ "$public_der" != "302a300506032b6570032100$SDW_UPDATE_PUBLIC_KEY" ]]; then
            echo "::error::The Ed25519 signing key does not match SDW_UPDATE_PUBLIC_KEY"
            exit 1
          fi
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS*' -printf '%f\0' | LC_ALL=C sort -z | xargs -0 sha256sum -- > SHA256SUMS.txt
          openssl pkeyutl -sign -rawin -inkey "$key" -in SHA256SUMS.txt -out SHA256SUMS.txt.sig
          openssl pkeyutl -verify -rawin -inkey "$key" -in SHA256SUMS.txt -sigfile SHA256SUMS.txt.sig
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: update-signature
          path: dist/SHA256SUMS.txt*
          if-no-files-found: error

  release:
    name: Draft release
    if: github.ref_type == 'tag'
    needs: [version, sign]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          path: dist
          merge-multiple: true
      - name: Check release artifacts
        working-directory: dist
        run: |
          test "$(wc -c < SHA256SUMS.txt.sig)" -eq 64
          sha256sum --strict --check SHA256SUMS.txt
      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null || true)
          case $draft in
            true)
              gh release upload "$TAG" dist/* --clobber
              gh release edit "$TAG" --prerelease="$PRERELEASE"
              ;;
            false)
              echo "::error::Release $TAG is already published; its files are left untouched"
              exit 1
              ;;
            *)
              notes=()
              if [[ "$PRERELEASE" == true ]]; then
                notes=(--notes 'macOS beta packages are ad hoc signed and are not notarized.')
              fi
              gh release create "$TAG" --draft --prerelease="$PRERELEASE" --verify-tag --title "SolideoWorship ${TAG#v}" --generate-notes "${notes[@]}" dist/*
              ;;
          esac
