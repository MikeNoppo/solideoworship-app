name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  INNO_SETUP_URL: https://github.com/jrsoftware/issrc/releases/download/is-7_1_1/innosetup-7.1.1-x64.exe
  INNO_SETUP_SHA256: 8a5a6711c3766a6e5fb74f280ba0e3551e719ce94538d901fdbd1f8f9920b3f0

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Read the workspace version
        id: version
        run: |
          version=$(cargo +stable metadata --no-deps --format-version 1 | jq -r '[.packages[].version] | unique | if length == 1 then .[0] else error("crate versions differ") end')
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the workspace version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  windows:
    name: Windows installer
    needs: version
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: cargo build --release --locked -p sdw-app
      - name: Check that the exe needs no MSVC runtime DLLs
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $dumpbin = & $vswhere -latest -products * -find 'VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe' | Select-Object -First 1
          if (-not $dumpbin) { throw 'dumpbin.exe not found' }
          $dependents = & $dumpbin /nologo /dependents target\release\sdw-app.exe
          if ($LASTEXITCODE -ne 0) { throw "dumpbin failed with exit code $LASTEXITCODE" }
          $dependents
          if ($dependents -match '(?i)^\s*(vcruntime|msvcp|ucrtbase|api-ms-win-crt)') { throw 'sdw-app.exe links the MSVC runtime dynamically' }
      - name: Install Inno Setup
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup.exe'
          Invoke-WebRequest -Uri $env:INNO_SETUP_URL -OutFile $installer
          $hash = (Get-FileHash -Algorithm SHA256 $installer).Hash
          if ($hash -ne $env:INNO_SETUP_SHA256) { throw "Inno Setup checksum mismatch: $hash" }
          $dir = Join-Path $env:RUNNER_TEMP 'inno-setup'
          $setup = Start-Process -FilePath $installer -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/DIR=`"$dir`"" -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Inno Setup install failed with exit code $($setup.ExitCode)" }
          "ISCC=$(Join-Path $dir 'ISCC.exe')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build the installer
        shell: pwsh
        run: '& $env:ISCC "/DAppVersion=$env:VERSION" packaging/windows/solideoworship.iss'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows
          path: target/installer/*.exe
          if-no-files-found: error

  linux:
    name: Linux tarball
    needs: version
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install libxcb
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxcb1-dev
      - run: rustup toolchain install
      - run: packaging/linux/package.sh "$VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: linux
          path: target/dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Draft release
    if: github.ref_type == 'tag'
    needs: [windows, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          path: dist
          merge-multiple: true
      - name: Write checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS.txt
      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null || true)
          case $draft in
            true)
              gh release upload "$TAG" dist/* --clobber
              ;;
            false)
              echo "::error::Release $TAG is already published; its files are left untouched"
              exit 1
              ;;
            *)
              gh release create "$TAG" --draft --verify-tag --title "SolideoWorship ${TAG#v}" --generate-notes dist/*
              ;;
          esac
