name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 1 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  FFMPEG_WIN_URL: https://github.com/FFmpeg-Builds/FFmpeg-Builds/releases/download/autobuild-2026-11-16-15-29/ffmpeg-n9.0.2-57-gd838f9f9ae-win64-lgpl-shared-9.0.zip
  FFMPEG_WIN_SHA256: bc661777e3aeb29cbd9e68f8b29a4ea1b54cc0db0373ff447085e5cb4ef307b3

jobs:
  fmt:
    name: Format
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: cargo fmt --all --check

  test:
    name: Clippy and test (${{ matrix.os }})
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxcb1-dev libasound2-dev pkg-config libavcodec-dev libavfilter-dev libavformat-dev libavutil-dev libswscale-dev libswresample-dev
      - name: Install macOS FFmpeg
        if: runner.os == 'macOS'
        run: brew install ffmpeg pkg-config
      - name: Install Windows FFmpeg
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'ffmpeg.zip'
          Invoke-WebRequest -Uri $env:FFMPEG_WIN_URL -OutFile $archive
          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($hash -ne $env:FFMPEG_WIN_SHA256) { throw "FFmpeg checksum mismatch: $hash" }
          $dest = Join-Path $env:RUNNER_TEMP 'ffmpeg'
          Expand-Archive -Path $archive -DestinationPath $dest -Force
          $root = (Get-ChildItem -Directory $dest | Select-Object -First 1).FullName
          "FFMPEG_INCLUDE_DIR=$(Join-Path $root 'include')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "FFMPEG_LIB_DIR=$(Join-Path $root 'lib')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Join-Path $root 'bin' | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets --locked --profile ci -- -D warnings
      - run: cargo test --workspace --locked --profile ci

  msrv:
    name: MSRV (${{ matrix.os }})
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxcb1-dev libasound2-dev pkg-config libavcodec-dev libavfilter-dev libavformat-dev libavutil-dev libswscale-dev libswresample-dev
      - name: Install macOS FFmpeg
        if: runner.os == 'macOS'
        run: brew install ffmpeg pkg-config
      - name: Install Windows FFmpeg
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'ffmpeg.zip'
          Invoke-WebRequest -Uri $env:FFMPEG_WIN_URL -OutFile $archive
          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($hash -ne $env:FFMPEG_WIN_SHA256) { throw "FFmpeg checksum mismatch: $hash" }
          $dest = Join-Path $env:RUNNER_TEMP 'ffmpeg'
          Expand-Archive -Path $archive -DestinationPath $dest -Force
          $root = (Get-ChildItem -Directory $dest | Select-Object -First 1).FullName
          "FFMPEG_INCLUDE_DIR=$(Join-Path $root 'include')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "FFMPEG_LIB_DIR=$(Join-Path $root 'lib')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Join-Path $root 'bin' | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Install the rust-version toolchain
        shell: bash
        run: |
          version=$(cargo +stable metadata --no-deps --format-version 1 | jq -r '[.packages[].rust_version] | unique | if length == 1 then .[0] else error("rust-version differs between crates") end')
          rustup toolchain install "$version" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$version" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo check --workspace --all-targets --locked --profile ci

  deny:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: ${{ matrix.checks == 'advisories' && github.event_name == 'pull_request' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - checks: advisories
            name: Dependency advisories
          - checks: bans licenses sources
            name: Dependency licenses and sources
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25
        with:
          command: check ${{ matrix.checks }}
