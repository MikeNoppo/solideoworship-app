name: Feature Request
description: Suggest an improvement or new capability for SolideoWorship
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Thanks for sharing an idea! Please check existing issues before opening a new one.
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What workflow or church presentation need does this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would you like this to work?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds or alternative approaches you've tried.
