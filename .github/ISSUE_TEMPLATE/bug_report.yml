name: Bug Report
description: Report a bug or unexpected behavior in SolideoWorship
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting a bug! Please include enough detail so we can reproduce it.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce the issue?
      placeholder: |
        1. Open SolideoWorship
        2. Go to ...
        3. Click ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Windows
        - macOS
        - Linux (Wayland)
        - Linux (X11)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App Version
      description: Release version or commit hash (e.g., 0.1.0-beta.2)
      placeholder: 0.1.0-beta.2
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, error messages, or monitor setup details.
