name: Set up Windows FFmpeg
description: Install the pinned x64 FFmpeg headers, import libraries and DLLs
runs:
  using: composite
  steps:
    - shell: pwsh
      env:
        FFMPEG_WIN_URL: https://github.com/FFmpeg-Builds/FFmpeg-Builds/releases/download/autobuild-2026-11-16-15-29/ffmpeg-n9.0.2-57-gd838f9f9ae-win64-lgpl-shared-9.0.zip
        FFMPEG_WIN_SHA256: bc661777e3aeb29cbd9e68f8b29a4ea1b54cc0db0373ff447085e5cb4ef307b3
      run: |
        $archive = Join-Path $env:RUNNER_TEMP 'ffmpeg.zip'
        Invoke-WebRequest -Uri $env:FFMPEG_WIN_URL -OutFile $archive
        $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
        if ($hash -ne $env:FFMPEG_WIN_SHA256) { throw "FFmpeg checksum mismatch: $hash" }
        $dest = Join-Path $env:RUNNER_TEMP 'ffmpeg'
        Expand-Archive -Path $archive -DestinationPath $dest -Force
        $root = (Get-ChildItem -Directory $dest | Select-Object -First 1).FullName
        $bin = Join-Path $root 'bin'
        "FFMPEG_INCLUDE_DIR=$(Join-Path $root 'include')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
        "FFMPEG_LIB_DIR=$(Join-Path $root 'lib')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
        "FFMPEG_BIN_DIR=$bin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
        $bin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
