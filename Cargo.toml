[workspace]
resolver = "3"
members = ["crates/core"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
iced = "0.14.0"
sdw-core = { path = "crates/core" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# WHY: iced dan wgpu terlalu lambat merender jika dikompilasi tanpa optimasi,
# sehingga UI terasa tersendat di debug build. Kode kita sendiri tetap opt-level 0
# supaya rebuild cepat.
[profile.dev.package."*"]
opt-level = 2
