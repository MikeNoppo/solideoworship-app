[workspace]
resolver = "3"
members = ["crates/core", "crates/library", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"

[workspace.dependencies]
iced = { version = "0.14.0", features = ["smol"] }
rusqlite = { version = "0.41", features = ["bundled"] }
sdw-core = { path = "crates/core" }
sdw-library = { path = "crates/library" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# WHY: iced dan wgpu terlalu lambat merender jika dikompilasi tanpa optimasi,
# sehingga UI terasa tersendat di debug build. Kode kita sendiri tetap opt-level 0
# supaya rebuild cepat.
[profile.dev.package."*"]
opt-level = 2
