[workspace]
resolver = "3"
members = ["crates/core", "crates/library", "crates/app"]

[workspace.package]
version = "0.1.0-beta.3"
edition = "2024"
rust-version = "1.92"
license = "GPL-3.0-only"

[workspace.dependencies]
iced = { version = "0.14.0", features = ["smol"] }
rusqlite = { version = "0.41", features = ["bundled"] }
sdw-core = { path = "crates/core" }
sdw-library = { path = "crates/library" }
quick-xml = "0.41"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# WHY: iced and wgpu render too slowly when compiled without optimisation, so the
# UI stutters in debug builds. Our own code stays at opt-level 0 to keep rebuilds fast.
[profile.dev.package."*"]
opt-level = 2

[profile.ci]
inherits = "dev"
debug = false

[profile.ci.package."*"]
opt-level = 0
