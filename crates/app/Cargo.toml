[package]
name = "sdw-app"
default-run = "sdw-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
bytemuck = { version = "1.25", features = ["derive"] }
iced = { workspace = true, features = ["advanced", "image-without-codecs"] }
sdw-core.workspace = true
sdw-library.workspace = true
sdw-media = { workspace = true, features = ["ffmpeg"] }
display-info = "0.5.9"
rfd = "0.18"
serde.workspace = true
serde_json.workspace = true
sys-locale = "0.3"
wgpu = { version = "27.0", default-features = false, features = ["std", "wgsl"] }

ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
semver = "1"
tempfile = "3"
ureq = { version = "3.5", default-features = false, features = ["platform-verifier", "rustls-no-provider"] }

[target.'cfg(target_os = "linux")'.dependencies]
flate2 = "1"
tar = { version = "0.4", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_System_Registry", "Win32_System_Threading"] }

[build-dependencies]
serde_json.workspace = true
winresource = { version = "0.1.34", default-features = false }
