[package]
name = "sdw-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
bytemuck = { version = "1.25", features = ["derive"] }
iced = { workspace = true, features = ["advanced", "image-without-codecs"] }
sdw-core.workspace = true
sdw-library.workspace = true
sdw-media = { workspace = true, features = ["ffmpeg"] }
display-info = "0.5.9"
rfd = "0.18"
serde.workspace = true
serde_json.workspace = true
sys-locale = "0.3"
wgpu = { version = "27.0", default-features = false, features = ["std", "wgsl"] }

[build-dependencies]
serde_json.workspace = true
winresource = { version = "0.1.34", default-features = false }
